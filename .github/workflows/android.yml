name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare env for secrets plugin
        run: |
          # Secrets plugin injects these into BuildConfig.
          # Empty values must be quoted strings or Java becomes invalid (e.g. KEY = ;).
          cat > .env << 'EOF'
          GEMINI_API_KEY=""
          OPENAI_API_KEY=""
          DEEPSEEK_API_KEY=""
          SMTP_HOST=""
          SMTP_PORT="587"
          SMTP_USER=""
          SMTP_PASS=""
          SMTP_FROM="TaskFlow AI <no-reply@taskflow.ai>"
          TWILIO_ACCOUNT_SID=""
          TWILIO_AUTH_TOKEN=""
          TWILIO_PHONE_NUMBER=""
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlowAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
